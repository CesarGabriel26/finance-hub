<section class="h-full w-full grid grid-rows-[auto_1fr] gap-4 ">
    <form [formGroup]="filters" class="bg-[var(--card)] p-4 rounded-xl shadow-lg grid grid-cols-[3fr_1fr_1fr] gap-4">
        <app-input formControlName="name" placeholder="Filtrar por texto..." />

        <app-select formControlName="type" [options]="ACCOUNT_TYPES" placeholder="Selecionar tipo" />
        <button (click)="openModal()"
            class="px-4 py-2 rounded-md flex justify-center items-center cursor-pointer select-none bg-[var(--primary)] text-[var(--primary-foreground)]">
            <span class="material-symbols-outlined">add</span>
            <span>Nova Conta bancária</span>
        </button>
    </form>

    <div class="w-full flex-1 min-h-0">
        <app-data-table title="Contas bancárias" description="Gerencie suas contas bancárias." [rows]="accounts()"
            [columns]="accountsColumns" [getRowId]="identifyAccount">

            <ng-template #dataTableRow let-row>
                <div class="grid grid-cols-[1fr_1fr_1fr_0.7fr_auto] w-full gap-4 items-center cursor-context-menu"
                    [appContextMenuTriggerFor]="myContextMenu" [appContextMenuData]="row">
                    <div class="flex items-center gap-4">
                        <div class="flex items-center justify-center w-10 h-10 rounded-full bg-muted text-muted-foreground flex-shrink-0"
                            [style.background-color]="row.color + '1a'">
                            <span class="material-symbols-outlined text-xl" [style.color]="row.color">
                                {{ row.icon || 'payments' }}
                            </span>

                        </div>

                        <div class="flex flex-col min-w-0">
                            <span class="font-semibold text-[var(--foreground)] truncate text-sm sm:text-base">
                                {{ row.name }}
                            </span>
                            <span class="text-xs text-[var(--foreground)] opacity-50 truncate">
                                {{ getAccLabel(row.type)}}
                            </span>
                        </div>
                    </div>

                    <span class="font-semibold text-[var(--foreground)] truncate text-sm sm:text-base">
                        {{ (row.balance || 0) | currency: 'BRL' }}
                    </span>

                    <span class="font-semibold text-[var(--foreground)] truncate text-sm sm:text-base">
                        {{ bankService.getBankByCode(row.bankCode)?.name }}
                    </span>

                    <span class="font-semibold text-[var(--foreground)] truncate text-sm sm:text-base">
                        {{ row.accountNumber || '-' }}
                    </span>

                    <button [appContextMenuTriggerFor]="myContextMenu" [appContextMenuData]="row"
                        appContextMenuTriggerType="click"
                        class="p-1.5 rounded-full text-muted-foreground hover:text-foreground hover:bg-muted transition-colors cursor-pointer"
                        type="button" aria-label="Mais opções">
                        <span class="material-symbols-outlined text-xl block">more_vert</span>
                    </button>
                </div>
            </ng-template>
        </app-data-table>
    </div>
</section>

<app-context-menu #myContextMenu [items]="menuItems" />
