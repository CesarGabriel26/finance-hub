<form (submit)="submit($event)" [formGroup]="form" class="space-y-5">
  <div class="mb-2">
    <h3 class="text-foreground text-lg font-black tracking-tight">
      {{ receivable ? 'Editar Conta a Receber' : 'Nova Conta a Receber' }}
    </h3>
    <p class="text-muted-foreground text-xs">
      Cadastre valores previstos para entrada e acompanhe recebimentos.
    </p>
  </div>

  <hr class="border-border my-2">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5 md:col-span-2">
      <label for="receivable-description" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Descricao
      </label>
      <app-input id="receivable-description" formControlName="description" placeholder="Ex: Mensalidade, venda, reembolso" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="payer" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Pagador
      </label>
      <app-input id="payer" formControlName="payer" placeholder="Cliente ou origem" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="receivable-amount" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Valor
      </label>
      <app-input id="receivable-amount" prefix="R$ " type="currency" formControlName="amount" placeholder="0,00" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="receivable-due-date" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Vencimento
      </label>
      <app-input id="receivable-due-date" type="date" formControlName="dueDate" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="received-at" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Recebimento
      </label>
      <app-input id="received-at" type="date" formControlName="receivedAt" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="receivable-status" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Status
      </label>
      <app-select id="receivable-status" formControlName="status" [options]="statusOptions" />
    </div>

    <label class="flex items-center gap-2 rounded-lg border border-border px-3 py-2 text-xs font-bold uppercase tracking-wider text-foreground">
      <input type="checkbox" formControlName="isRecurring"
        class="h-4 w-4 rounded border-border bg-card text-[var(--primary)]">
      Recorrente ou parcelada
    </label>

    @if (form.controls.isRecurring.value) {
    <div class="flex flex-col gap-1.5">
      <label for="receivable-recurrence" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Classificacao
      </label>
      <app-select id="receivable-recurrence" formControlName="recurrenceClassification" [options]="[
        { value: 'fixed', label: 'Fixa' },
        { value: 'variable', label: 'Variavel' }
      ]" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="receivable-installment-current" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Parcela Atual
      </label>
      <app-input id="receivable-installment-current" type="number" formControlName="currentInstallment" placeholder="1" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="receivable-installment-total" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Total de Parcelas
      </label>
      <app-input id="receivable-installment-total" type="number" formControlName="totalInstallments" placeholder="1" />
    </div>
    }

    <div class="flex flex-col gap-1.5">
      <label for="receivable-account" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Conta
      </label>
      <app-select id="receivable-account" formControlName="accountId" [options]="accountOptions()" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="receivable-category" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Categoria
      </label>
      <app-select id="receivable-category" formControlName="categoryId" [options]="categoryOptions()" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="receivable-notes" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Observacoes
      </label>
      <app-input id="receivable-notes" formControlName="notes" placeholder="Detalhes adicionais" />
    </div>
  </div>

  <div class="pt-4 flex justify-end">
    <button type="submit" [disabled]="form.invalid"
      class="primary-button w-full sm:w-auto min-w-[140px] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:filter-none">
      {{ receivable ? 'Salvar Alteracoes' : 'Criar Conta' }}
    </button>
  </div>
</form>
