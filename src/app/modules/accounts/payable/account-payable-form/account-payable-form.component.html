<form (submit)="submit($event)" [formGroup]="form" class="space-y-5">
  <div class="mb-2">
    <h3 class="text-foreground text-lg font-black tracking-tight">
      {{ payable ? 'Editar Conta a Pagar' : 'Nova Conta a Pagar' }}
    </h3>
    <p class="text-muted-foreground text-xs">
      Cadastre compromissos previstos e acompanhe pagamentos.
    </p>
  </div>

  <hr class="border-border my-2">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5 md:col-span-2">
      <label for="payable-description" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Descricao
      </label>
      <app-input id="payable-description" formControlName="description" placeholder="Ex: Aluguel, fornecedor, boleto" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="payee" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Beneficiario
      </label>
      <app-input id="payee" formControlName="payee" placeholder="Fornecedor ou destino" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="payable-amount" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Valor
      </label>
      <app-input id="payable-amount" prefix="R$ " type="currency" formControlName="amount" placeholder="0,00" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="payable-due-date" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Vencimento
      </label>
      <app-input id="payable-due-date" type="date" formControlName="dueDate" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="paid-at" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Pagamento
      </label>
      <app-input id="paid-at" type="date" formControlName="paidAt" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="payable-status" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Status
      </label>
      <app-select id="payable-status" formControlName="status" [options]="statusOptions" />
    </div>

    <label class="flex items-center gap-2 rounded-lg border border-border px-3 py-2 text-xs font-bold uppercase tracking-wider text-foreground">
      <input type="checkbox" formControlName="isRecurring"
        class="h-4 w-4 rounded border-border bg-card text-[var(--primary)]">
      Recorrente ou parcelada
    </label>

    @if (form.controls.isRecurring.value) {
    <div class="flex flex-col gap-1.5">
      <label for="payable-recurrence" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Classificacao
      </label>
      <app-select id="payable-recurrence" formControlName="recurrenceClassification" [options]="[
        { value: 'fixed', label: 'Fixa' },
        { value: 'variable', label: 'Variavel' }
      ]" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="payable-installment-current" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Parcela Atual
      </label>
      <app-input id="payable-installment-current" type="number" formControlName="currentInstallment" placeholder="1" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="payable-installment-total" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Total de Parcelas
      </label>
      <app-input id="payable-installment-total" type="number" formControlName="totalInstallments" placeholder="1" />
    </div>
    }

    <div class="flex flex-col gap-1.5">
      <label for="payable-account" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Conta
      </label>
      <app-select id="payable-account" formControlName="accountId" [options]="accountOptions()" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="payable-category" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Categoria
      </label>
      <app-select id="payable-category" formControlName="categoryId" [options]="categoryOptions()" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="payable-notes" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Observacoes
      </label>
      <app-input id="payable-notes" formControlName="notes" placeholder="Detalhes adicionais" />
    </div>
  </div>

  <div class="pt-4 flex justify-end">
    <button type="submit" [disabled]="form.invalid"
      class="primary-button w-full sm:w-auto min-w-[140px] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:filter-none">
      {{ payable ? 'Salvar Alteracoes' : 'Criar Conta' }}
    </button>
  </div>
</form>
