<form (submit)="submit($event)" [formGroup]="form" class="space-y-5">
  <div class="mb-2">
    <h3 class="text-foreground text-lg font-black tracking-tight">
      {{ portfolio ? 'Editar Carteira' : 'Nova Carteira' }}
    </h3>
    <p class="text-muted-foreground text-xs">
      Defina estrategia, risco, moeda e nivel de detalhe da carteira.
    </p>
  </div>

  <hr class="border-border my-2">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5 md:col-span-2">
      <label for="portfolio-name" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Nome da Carteira
      </label>
      <app-input id="portfolio-name" formControlName="name" placeholder="Ex: Buy and Hold, Renda Passiva" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="strategy" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Estrategia
      </label>
      <app-select id="strategy" formControlName="strategy" [options]="[
        { value: 'balanced', label: 'Balanceada' },
        { value: 'income', label: 'Renda' },
        { value: 'growth', label: 'Crescimento' },
        { value: 'capital_preservation', label: 'Preservacao' },
        { value: 'custom', label: 'Personalizada' }
      ]" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="risk-profile" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Perfil
      </label>
      <app-select id="risk-profile" formControlName="riskProfile" [options]="[
        { value: 'conservative', label: 'Conservador' },
        { value: 'moderate', label: 'Moderado' },
        { value: 'aggressive', label: 'Agressivo' }
      ]" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="benchmark" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Benchmark
      </label>
      <app-input id="benchmark" formControlName="benchmark" placeholder="CDI, IPCA+6, IBOV" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="currency" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
        Moeda
      </label>
      <app-select id="currency" formControlName="currency" [options]="[
        { value: 'BRL', label: 'BRL' },
        { value: 'USD', label: 'USD' },
        { value: 'EUR', label: 'EUR' }
      ]" />
    </div>
  </div>

  <label class="flex items-center gap-3 rounded-md border border-border p-3 text-sm font-semibold text-foreground">
    <input type="checkbox" formControlName="beginnerMode" class="h-4 w-4 accent-[var(--primary)]">
    <span>Usar modo iniciante por padrao</span>
  </label>

  <div class="flex flex-col gap-1.5">
    <label for="portfolio-notes" class="text-foreground text-xs font-extrabold uppercase tracking-wider">
      Observacoes
    </label>
    <app-input id="portfolio-notes" formControlName="notes" placeholder="Regras de aporte, objetivo, limites..." />
  </div>

  <div class="pt-4 flex justify-end">
    <button type="submit" [disabled]="form.invalid"
      class="primary-button w-full sm:w-auto min-w-[140px] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:filter-none">
      {{ portfolio ? 'Salvar Carteira' : 'Criar Carteira' }}
    </button>
  </div>
</form>
