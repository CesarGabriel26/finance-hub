<section class="h-full w-full grid grid-rows-[auto_1fr] gap-4 overflow-hidden">
  <form [formGroup]="filters" class="bg-[var(--card)] p-4 rounded-xl shadow-lg grid grid-cols-1 lg:grid-cols-[3fr_1fr_auto] gap-4">
    <app-input formControlName="name" placeholder="Filtrar por texto..." />

    <app-select formControlName="type" [options]="[
      { value: '', label: 'Todos' },
      { value: 'expense', label: 'Despesa' },
      { value: 'income', label: 'Receita' }
    ]" placeholder="Selecionar tipo" />

    <button type="button" (click)="openModal()"
      class="px-4 py-2 rounded-md flex justify-center items-center gap-2 cursor-pointer select-none bg-[var(--primary)] text-[var(--primary-foreground)]">
      <span class="material-symbols-outlined">add</span>
      <span>Nova Categoria</span>
    </button>
  </form>

  <div class="w-full flex-1 min-h-0">
    <app-data-table title="Categorias" description="Gerencie suas categorias de despesas e receitas."
      [rows]="categories()" [columns]="categoryColumns" [getRowId]="identifyCategory">

      <ng-template #dataTableRow let-row>
        <div class="grid grid-cols-[1fr_auto_auto] w-full gap-4 items-center cursor-context-menu"
          [appContextMenuTriggerFor]="categoryContextMenu" [appContextMenuData]="row">
          <div class="flex items-center gap-4 min-w-0">
            <div class="flex items-center justify-center w-10 h-10 rounded-full bg-muted text-muted-foreground flex-shrink-0"
              [style.background-color]="row.color + '1a'">
              <span class="material-symbols-outlined text-xl" [style.color]="row.color">
                {{ row.icon || 'payments' }}
              </span>
            </div>

            <div class="flex flex-col min-w-0">
              <span class="font-semibold text-[var(--foreground)] truncate text-sm sm:text-base">
                {{ row.name }}
              </span>
              <span class="text-xs text-[var(--foreground)] opacity-50 truncate">
                {{ row.type === 'expense' ? 'Despesa' : 'Receita' }}
              </span>
            </div>
          </div>

          <span class="rounded-full px-2.5 py-1 text-xs font-bold"
            [class.bg-amber-500/10]="row.isFixed"
            [class.text-amber-700]="row.isFixed"
            [class.bg-slate-500/10]="!row.isFixed"
            [class.text-slate-600]="!row.isFixed">
            {{ row.isFixed ? 'Fixa' : 'Variavel' }}
          </span>

          <button [appContextMenuTriggerFor]="categoryContextMenu" [appContextMenuData]="row"
            appContextMenuTriggerType="click"
            class="p-1.5 rounded-full text-muted-foreground hover:text-foreground hover:bg-muted transition-colors cursor-pointer"
            type="button" aria-label="Mais opcoes">
            <span class="material-symbols-outlined text-xl block">more_vert</span>
          </button>
        </div>
      </ng-template>
    </app-data-table>
  </div>
</section>

<app-context-menu #categoryContextMenu [items]="menuItems" />
