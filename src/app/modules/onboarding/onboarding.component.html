<section class="h-full w-full overflow-y-auto">
  <div class="max-w-6xl mx-auto grid gap-4">
    <div class="bg-[var(--card)] rounded-xl border border-border p-5 shadow-sm">
      <span class="text-xs font-bold uppercase text-muted-foreground">Primeiros passos</span>
      <h1 class="mt-2 text-2xl font-black text-foreground">Configure o essencial sem se perder</h1>
      <p class="mt-1 text-sm text-muted-foreground">
        {{ completedCount() }} de {{ steps().length }} etapas concluidas.
      </p>
      <div class="mt-4 h-2 rounded-full bg-[var(--muted)] overflow-hidden">
        <div class="h-full rounded-full bg-[var(--primary)]" [style.width.%]="steps().length ? (completedCount() / steps().length) * 100 : 0"></div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      @for (step of steps(); track step.label) {
      <a [routerLink]="step.route"
        class="bg-[var(--card)] rounded-xl border border-border p-5 shadow-sm hover:shadow-md transition-shadow">
        <div class="flex items-start justify-between gap-4">
          <div class="w-11 h-11 rounded-lg flex items-center justify-center"
            [style.background]="step.done ? 'color-mix(in oklch, var(--success) 12%, var(--card))' : 'var(--muted)'"
            [style.color]="step.done ? 'var(--success)' : 'var(--muted-foreground)'">
            <span class="material-symbols-outlined">{{ step.done ? 'check_circle' : step.icon }}</span>
          </div>
          <span class="text-xs font-bold uppercase" [class.text-success]="step.done" [class.text-muted-foreground]="!step.done">
            {{ step.done ? 'Concluido' : 'Pendente' }}
          </span>
        </div>
        <strong class="block mt-4 text-base text-foreground">{{ step.label }}</strong>
        <span class="block mt-1 text-sm text-muted-foreground">{{ step.description }}</span>
      </a>
      }
    </div>
  </div>
</section>
