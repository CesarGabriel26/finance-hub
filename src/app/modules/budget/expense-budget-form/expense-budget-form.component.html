<form (submit)="submit($event)" [formGroup]="form" class="friendly-form">
  <header class="form-hero">
    <span class="material-symbols-outlined">percent</span>
    <div>
      <h3>{{ budget ? 'Editar orcamento' : 'Novo orcamento' }}</h3>
      <p>Defina quanto voce quer gastar em uma categoria durante o mes.</p>
    </div>
  </header>

  <section class="form-section">
    <div class="section-title">
      <span>1</span>
      <div>
        <h4>Categoria e limite</h4>
        <p>Exemplo: Alimentacao com limite de R$ 800 no mes.</p>
      </div>
    </div>

    <div class="field-grid">
      <label class="field" for="budget-category">
        <span>Categoria</span>
        <app-select id="budget-category" formControlName="categoryId" [options]="categoryOptions()" placeholder="Escolha a categoria" />
      </label>

      <label class="field" for="budget-limit">
        <span>Limite do mes</span>
        <app-input id="budget-limit" type="currency" prefix="R$ " formControlName="amountLimit" />
      </label>
    </div>
  </section>

  <section class="form-section">
    <div class="section-title">
      <span>2</span>
      <div>
        <h4>Avisos</h4>
        <p>O sistema pode avisar quando voce estiver chegando perto do limite.</p>
      </div>
    </div>

    <div class="field-grid">
      <label class="field" for="budget-kind">
        <span>Como controlar</span>
        <app-select id="budget-kind" formControlName="targetKind" [options]="[
          { value: 'maximum', label: 'Nao passar desse valor' },
          { value: 'minimum', label: 'Tentar atingir pelo menos esse valor' }
        ]" />
      </label>

      <label class="field" for="budget-alert">
        <span>Avisar em (%)</span>
        <app-input id="budget-alert" type="number" formControlName="alertPercent" placeholder="80" />
      </label>

      <label class="field field-wide" for="budget-notes">
        <span>Observacao opcional</span>
        <app-input id="budget-notes" formControlName="notes" placeholder="Ex: incluir mercado e restaurante" />
      </label>
    </div>
  </section>

  <footer class="form-actions">
    <button type="submit" [disabled]="form.invalid" class="primary-button disabled:opacity-50 disabled:cursor-not-allowed">
      {{ budget ? 'Salvar orcamento' : 'Criar orcamento' }}
    </button>
  </footer>
</form>
