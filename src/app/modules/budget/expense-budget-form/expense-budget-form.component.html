<form (submit)="submit($event)" [formGroup]="form" class="space-y-5">
  <div class="mb-2">
    <h3 class="text-foreground text-lg font-black tracking-tight">
      {{ budget ? 'Editar Meta de Despesa' : 'Nova Meta de Despesa' }}
    </h3>
    <p class="text-muted-foreground text-xs">
      Defina um limite mensal para uma categoria de despesa.
    </p>
  </div>

  <hr class="border-border my-2">

  <div class="grid grid-cols-1 gap-4">
    <div class="flex flex-col gap-1.5">
      <label for="budget-category" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Categoria</label>
      <app-select id="budget-category" formControlName="categoryId" [options]="categoryOptions()" placeholder="Selecione" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="budget-limit" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Limite Mensal</label>
      <app-input id="budget-limit" type="currency" prefix="R$ " formControlName="amountLimit" />
    </div>
  </div>

  <div class="pt-4 flex justify-end">
    <button type="submit" [disabled]="form.invalid"
      class="primary-button w-full sm:w-auto min-w-[140px] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:filter-none">
      {{ budget ? 'Salvar Meta' : 'Criar Meta' }}
    </button>
  </div>
</form>
