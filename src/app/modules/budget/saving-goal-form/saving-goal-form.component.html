<form (submit)="submit($event)" [formGroup]="form" class="space-y-5">
  <div class="mb-2">
    <h3 class="text-foreground text-lg font-black tracking-tight">
      {{ goal ? 'Editar Meta de Poupanca' : 'Nova Meta de Poupanca' }}
    </h3>
    <p class="text-muted-foreground text-xs">
      Defina objetivo, valor alvo, progresso, prazo e identidade visual.
    </p>
  </div>

  <hr class="border-border my-2">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5 md:col-span-2">
      <label for="goal-name" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Nome</label>
      <app-input id="goal-name" formControlName="name" placeholder="Reserva de emergencia, viagem, carro..." />
    </div>

    <div class="flex flex-col gap-1.5 md:col-span-2">
      <label for="goal-description" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Descricao</label>
      <app-input id="goal-description" formControlName="description" placeholder="Detalhe o objetivo" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="target-amount" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Valor Alvo</label>
      <app-input id="target-amount" type="currency" prefix="R$ " formControlName="targetAmount" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="current-amount" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Valor Atual</label>
      <app-input id="current-amount" type="currency" prefix="R$ " formControlName="currentAmount" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="target-date" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Prazo</label>
      <app-input id="target-date" type="date" formControlName="targetDate" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="goal-status" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Status</label>
      <app-select id="goal-status" formControlName="status" [options]="[
        { value: 'active', label: 'Ativa' },
        { value: 'completed', label: 'Concluida' },
        { value: 'paused', label: 'Pausada' }
      ]" />
    </div>

    <div class="flex flex-col gap-1.5 md:col-span-2">
      <label for="goal-account" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Conta Vinculada</label>
      <app-select id="goal-account" formControlName="accountId" [options]="accountOptions()" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="goal-color" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Cor</label>
      <app-color-picker id="goal-color" formControlName="color" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="goal-icon" class="text-foreground text-xs font-extrabold uppercase tracking-wider">Icone</label>
      <app-icon-picker id="goal-icon" formControlName="icon" />
    </div>
  </div>

  <div class="pt-4 flex justify-end">
    <button type="submit" [disabled]="form.invalid"
      class="primary-button w-full sm:w-auto min-w-[140px] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:filter-none">
      {{ goal ? 'Salvar Meta' : 'Criar Meta' }}
    </button>
  </div>
</form>
