<div cdkOverlayOrigin #trigger="cdkOverlayOrigin" (click)="toggle()"
    class="flex gap-3 items-center w-full finance-input !py-1.5 cursor-pointer select-none transition-all"
    [class.opacity-40]="disabled()" [class.cursor-not-allowed]="disabled()">

    <div
        class="w-10 h-10 rounded-xl bg-muted border border-border flex items-center justify-center text-primary flex-none transition-colors">
        <span class="material-symbols-outlined text-xl select-none">
            {{ value() }}
        </span>
    </div>

    <div class="flex-1 min-w-0">
        <span
            class="block text-xs font-extrabold uppercase tracking-wider text-muted-foreground select-none leading-none mb-0.5">
            {{ label }}
        </span>
        <span class="block text-sm font-bold text-foreground truncate uppercase tracking-wide">
            {{ value().replace('_', ' ') }}
        </span>
    </div>

    <span
        class="material-symbols-outlined text-muted-foreground pr-1 text-lg transform transition-transform duration-200 select-none"
        [class.rotate-180]="isOpen()">
        keyboard_arrow_down
    </span>
</div>

<ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayHasBackdrop]="true" cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="isOpen.set(false)">

    <div
        class="mt-2 w-[300px] bg-[var(--popover)] border border-border rounded-[var(--radius-md,0.75rem)] shadow-2xl flex flex-col overflow-hidden z-50 animate-scale-up text-card-foreground">

        <div class="p-3 border-b border-border bg-background/30 flex items-center gap-2">
            <span class="material-symbols-outlined text-muted-foreground text-lg select-none">search</span>
            <input type="text" [value]="searchTerm()" (input)="onSearch($event)"
                placeholder="Buscar ícone... (ex: wallet, card)"
                class="w-full bg-transparent border-none outline-none text-sm text-foreground placeholder-muted-foreground font-medium" />
        </div>

        <div class="p-3 max-h-56 overflow-y-auto grid grid-cols-5 gap-2 scrollbar-thin">

            @for (icon of filteredIcons(); track icon) {
            <button type="button" (click)="selectIcon(icon)" [title]="icon"
                class="w-11 h-11 rounded-xl flex items-center justify-center transition-all duration-150 cursor-pointer select-none"
                [class.bg-sidebar-primary]="icon === value()" [class.text-sidebar-primary-foreground]="icon === value()"
                [class.hover:bg-sidebar-accent]="icon !== value()"
                [class.hover:text-sidebar-accent-foreground]="icon !== value()"
                [class.text-foreground]="icon !== value()">
                <span class="material-symbols-outlined text-xl select-none">
                    {{ icon }}
                </span>
            </button>
            } @empty {
            <div class="col-span-5 py-6 text-center text-xs text-muted-foreground font-medium">
                Nenhum ícone encontrado.
            </div>
            }

        </div>

        <div
            class="px-4 py-2 border-t border-border bg-muted/20 flex justify-between items-center text-[10px] font-bold text-muted-foreground uppercase tracking-wider select-none">
            <span>Total: {{ iconDatabase.length }} ícones</span>
            <span>Material Symbols</span>
        </div>

    </div>
</ng-template>
