<aside class="app-sidebar">
  <div class="brand">
    <img src="icon.png" alt="Finance Hub" class="brand-icon">
    <div class="min-w-0">
      <strong>Finance Hub</strong>
      <span>seu dinheiro simples</span>
    </div>
  </div>

  <nav class="nav-groups">
    @for (section of sections; track section.label || 'main') {
    <section class="nav-section">
      @if (section.label) {
      <span class="nav-section-title">{{ section.label }}</span>
      }

      <ul>
        @for (link of section.links; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link" [class.advanced-nav-link]="link.advanced">
            <span class="material-symbols-outlined">{{ link.icon }}</span>
            <span>{{ link.label }}</span>
          </a>
        </li>
        }
      </ul>
    </section>
    }
  </nav>
</aside>
