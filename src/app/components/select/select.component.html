<div
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  (click)="toggleDropdown()"
  class="w-full px-4 py-2 border border-border rounded-[var(--radius-sm,0.5rem)] bg-transparent flex justify-between items-center gap-2 cursor-pointer select-none focus:outline-none focus:ring-2 focus:ring-ring"
>
  <span class="text-foreground text-sm font-medium truncate min-w-0">{{ selectedLabel }}</span>
  <span
    class="material-symbols-outlined text-foreground transform transition-transform duration-200 select-none"
    [class.rotate-180]="isOpen()"
  >
    arrow_drop_down
  </span>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayWidth]="trigger.elementRef.nativeElement.offsetWidth"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="closeDropdown()"
>
  <div
    class="mt-1 w-full bg-[var(--popover)] border border-border rounded-[var(--radius-md,0.75rem)] shadow-lg overflow-hidden focus:outline-none z-50"
  >
    @if (searchable) {
      <div class="p-2 border-b border-border">
        <div
          class="flex items-center gap-2 rounded-md border border-border bg-transparent px-3 py-2 focus-within:border-primary transition-colors"
        >
          <span class="material-symbols-outlined text-muted-foreground text-lg select-none">search</span>
          <input
            #searchInput
            type="search"
            [placeholder]="searchPlaceholder"
            [value]="searchTerm()"
            (input)="updateSearch($event)"
            (click)="$event.stopPropagation()"
            class="w-full bg-transparent border-none outline-none text-foreground text-sm font-medium focus:ring-0"
          />
        </div>
      </div>
    }

    <ul class="max-h-60 overflow-auto focus:outline-none scrollbar-thin">
      @for (option of filteredOptions(); track option.value) {
        <li
          (click)="selectOption(option)"
          [ngClass]="{
            'bg-[var(--sidebar-primary)] text-[var(--sidebar-primary-foreground)] font-bold':
              option.value === selectedValue()
          }"
          class="px-4 flex items-center gap-2 py-2 hover:bg-[var(--sidebar-accent)] hover:text-[var(--sidebar-accent-foreground)] cursor-pointer text-[var(--popover-foreground)] text-sm select-none transition-colors duration-150"
        >
          @if (option.icon) {
            <span class="material-symbols-outlined">{{ option.icon }}</span>
          }
          <span class="truncate">{{ option.label }}</span>
        </li>
      } @empty {
        <li class="px-4 py-3 text-muted-foreground text-sm select-none">
          {{ emptyMessage }}
        </li>
      }
    </ul>
  </div>
</ng-template>
