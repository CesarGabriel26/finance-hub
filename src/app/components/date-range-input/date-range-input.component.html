<!-- Botão de Trigger (Origem do Overlay) -->
<div cdkOverlayOrigin #trigger="cdkOverlayOrigin" (click)="toggleOverlay()"
    class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white flex justify-between items-center cursor-pointer select-none focus:outline-none focus:ring-2 focus:ring-blue-500">

    <span class="text-gray-700">{{ displayLabel }}</span>
    <span class="text-gray-400 transform transition-transform duration-200" [class.rotate-180]="isOpen()">
        📅
    </span>
</div>

<!-- Menu Flutuante (Overlay) -->
<ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayHasBackdrop]="true" cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="isOpen.set(false)">

    <!-- Popover de Seleção de Datas -->
    <div class="mt-1 p-4 bg-white border border-gray-200 rounded-md shadow-lg w-80 flex flex-col gap-3 focus:outline-none z-50"
         [formGroup]="range">
        
        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-500">Data Inicial</label>
            <input type="date" formControlName="start" 
                   class="px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-500">Data Final</label>
            <input type="date" formControlName="end" 
                   class="px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700">
        </div>

        <div class="flex justify-end gap-2 mt-2 pt-2 border-t border-gray-100">
            <button type="button" (click)="clearRange()"
                    class="px-3 py-1.5 text-sm text-gray-500 hover:bg-gray-100 rounded-md transition-colors">
                Limpar
            </button>
            <button type="button" (click)="applyRange()"
                    class="px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md transition-colors">
                Aplicar
            </button>
        </div>
    </div>
</ng-template>
