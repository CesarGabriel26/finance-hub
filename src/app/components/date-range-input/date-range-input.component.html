<!-- Botão de Trigger (Origem do Overlay) -->
<div cdkOverlayOrigin #trigger="cdkOverlayOrigin" (click)="toggleOverlay()"
    class="w-full px-4 py-2 border border-border rounded-md bg-transparent flex justify-between items-center cursor-pointer select-none focus:outline-none focus:ring-2 focus:ring-ring">

    <span class="text-foreground">{{ displayLabel }}</span>
    <span class="material-symbols-outlined text-muted-foreground transform transition-transform duration-200"
        [class.rotate-180]="isOpen()">
        calendar_month
    </span>
</div>

<!-- Menu Flutuante (Overlay) -->
<ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayHasBackdrop]="true" cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="isOpen.set(false)">

    <!-- Popover de Seleção de Datas -->
    <div class="mt-1 p-4 bg-popover border border-border rounded-md shadow-lg w-80 flex flex-col gap-3 focus:outline-none z-50"
        [formGroup]="range">

        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-muted-foreground">Data Inicial</label>
            <input type="date" formControlName="start"
                class="px-3 py-1.5 border border-border rounded-md bg-transparent focus:outline-none focus:ring-2 focus:ring-ring text-foreground">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-muted-foreground">Data Final</label>
            <input type="date" formControlName="end"
                class="px-3 py-1.5 border border-border rounded-md bg-transparent focus:outline-none focus:ring-2 focus:ring-ring text-foreground">
        </div>

        <div class="flex justify-end gap-2 mt-2 pt-2 border-t border-border">
            <button type="button" (click)="clearRange()"
                class="px-3 py-1.5 text-sm text-muted-foreground hover:bg-muted rounded-md transition-colors">
                Limpar
            </button>
            <button type="button" (click)="applyRange()"
                class="px-3 py-1.5 text-sm bg-primary hover:bg-primary-hover text-primary-foreground rounded-md transition-colors">
                Aplicar
            </button>
        </div>
    </div>
</ng-template>
